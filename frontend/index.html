<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Kaam</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg hidden aria-hidden="true">
    <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8L7 4Z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-again" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
  </svg>

  <main>
    <!-- 1. Choose a language. Tapping one moves on; there is nothing else to do. -->
    <section id="screen-home">
      <h1 class="wordmark">Kaam</h1>
      <p class="tagline">Speak your skills. Get hired.</p>
      <h2 class="section-title">अपनी भाषा चुनें · Choose your language</h2>
      <div id="languages" class="group"></div>
      <button id="open-samples" class="row-button watch">
        <svg class="icon"><use href="#i-play"/></svg>
        <span><b>Watch an Example</b><small>No microphone needed</small></span>
      </button>
    </section>

    <!-- Examples, one step away so the main path stays clean -->
    <section id="screen-samples" hidden>
      <button class="icon-button" data-go="home" aria-label="Back"><svg class="icon"><use href="#i-back"/></svg></button>
      <h1 class="title">Watch an Example</h1>
      <p class="body-2">These workers are fictional, with synthetic voices and real-world background noise. Their answers run through the same live system as yours.</p>
      <div id="samples" class="group"></div>
    </section>

    <!-- 2. What's about to happen, also read aloud. Tapping Start is the agreement. -->
    <section id="screen-intro" hidden>
      <button class="icon-button" data-go="home" aria-label="Back"><svg class="icon"><use href="#i-back"/></svg></button>
      <h1 id="intro-title" class="title"></h1>
      <p id="intro-text" class="body-2"></p>
      <button id="intro-replay" class="icon-button tinted" aria-label="Listen"><svg class="icon"><use href="#i-speaker"/></svg></button>
      <p id="intro-error" class="error" role="alert" hidden></p>
      <div class="action-bar">
        <button id="start" class="prominent"><svg class="icon"><use href="#i-mic"/></svg><span id="start-label"></span></button>
      </div>
    </section>

    <!-- 3. One question at a time -->
    <section id="screen-interview" hidden>
      <div class="top-row">
        <button id="close" class="icon-button" aria-label="Close"><svg class="icon"><use href="#i-close"/></svg></button>
        <div id="steps" class="steps" role="img"></div>
      </div>
      <p id="sample-banner" class="sample-banner" hidden></p>
      <h1 id="question" class="question"></h1>
      <p id="gloss" class="body-2" hidden></p>
      <button id="replay" class="icon-button tinted" aria-label="Listen"><svg class="icon"><use href="#i-speaker"/></svg></button>

      <div class="mic-area">
        <div class="mic-stage">
          <div id="mic" class="mic"><svg class="icon"><use id="mic-glyph" href="#i-speaker"/></svg></div>
        </div>
        <p id="mic-status" class="mic-status" aria-live="polite"></p>
      </div>

      <div id="spoken" class="spoken"><span id="spoken-final"></span> <span id="spoken-live" class="partial"></span></div>
      <textarea id="answer" rows="4" hidden></textarea>
      <button id="fix" class="plain" hidden><svg class="icon"><use href="#i-pencil"/></svg><span id="fix-label"></span></button>

      <div id="interview-actions" class="action-bar">
        <button id="rerecord" class="secondary"><svg class="icon"><use href="#i-again"/></svg><span id="again-label"></span></button>
        <button id="next" class="prominent"><span id="next-label"></span><svg class="icon"><use href="#i-next"/></svg></button>
      </div>
    </section>

    <!-- 4. Last choice, then the card gets made -->
    <section id="screen-done" hidden>
      <div id="voice-choice" hidden>
        <h1 id="voice-q" class="title"></h1>
        <div class="group">
          <button class="row" data-voice="female"><span id="female-label"></span><svg class="icon chevron"><use href="#i-chevron"/></svg></button>
          <button class="row" data-voice="male"><span id="male-label"></span><svg class="icon chevron"><use href="#i-chevron"/></svg></button>
        </div>
      </div>
      <div id="building" class="building" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p id="building-text" class="title-3" aria-live="polite"></p>
        <button id="build" class="prominent" hidden></button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>

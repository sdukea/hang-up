# Render's free tier sleeps after 15 idle minutes, and the first visitor then waits up to a minute.
# A light ping every 10 minutes keeps the game awake. It only reads /api/health and stores nothing.
name: Keep awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the game
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://play-hangup.onrender.com/api/health

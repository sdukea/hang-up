[project]
name = "hang-up"
version = "0.1.0"
description = "Try to scam Kamla Dadi by voice. She fights back. Built on Gnani Prisma and Timbre."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=14",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
